name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python (lint / test / audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Lint (syntax check)
        # 仓库根即包根，直接编译当前目录；跳过备份/归档与 Java 侧翼。
        run: python -m compileall -q . -x '(backups|archive|node_modules|\.git|java)'
      - name: Run tests
        # 包名 APIProxy 即仓库目录名：把父目录加入 PYTHONPATH，使 conftest 与
        # `import APIProxy` 都能解析（对应本地 `cd .. && pytest APIProxy/tests/` 的姿势）。
        env:
          PYTHONPATH: ${{ github.workspace }}/..
        run: python -m pytest tests/ -q
      - name: Dependency consistency check
        run: pip check
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  java:
    name: Java (Spring Boot sidecar / compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile & package (skip tests)
        # 仅做编译验证，确保 Java 侧翼不因源码漂移而无法构建
        run: mvn -B -q -DskipTests package
