# Nginx 配置示例
# 
# 最终方案：
#   - 主应用（用户访问）：5000 端口，HTTP（Python 直接监听）
#   - Debug Console Web（运维访问）：8080 端口，HTTPS（Nginx 反向代理）
#
# Python 只监听 5000 端口（HTTP），8080 HTTPS 由 Nginx 卸载
# 将此文件复制到 /etc/nginx/sites-available/ 并创建软链接到 sites-enabled/


# ============================================================
# Debug Console Web 控制台（运维访问，8080 端口 HTTPS）
# ============================================================
# 通过独立端口 + HTTPS 访问，与用户流量隔离，更安全
# 访问地址：https://your-domain:8080/
# 反向代理到：http://127.0.0.1:5000/debug-console/

server {
    listen 8080 ssl;
    server_name your-domain.com;  # 替换为你的域名或服务器 IP

    # ---------- SSL 证书配置 ----------
    # 使用 Let's Encrypt 或其他证书
    ssl_certificate /path/to/your/cert.pem;      # 替换为证书路径
    ssl_certificate_key /path/to/your/privkey.pem;  # 替换为私钥路径

    # ---------- SSL 安全配置 ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:DEBUG_CONSOLE_SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 安全头 ----------
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- 日志 ----------
    access_log /var/log/nginx/debug-console-web-access.log;
    error_log /var/log/nginx/debug-console-web-error.log;

    # ---------- 访问控制（可选，强烈建议开启） ----------
    # 只允许特定 IP 访问 Debug Console 控制台，增强安全性
    # allow 192.168.1.0/24;   # 内网网段
    # allow 10.0.0.0/8;       # 内网网段
    # allow 123.45.67.89;     # 指定公网 IP
    # deny all;

    # ---------- 客户端请求体大小 ----------
    client_max_body_size 10M;

    # ---------- 反向代理 ----------
    # 8080 根路径 → 5000 端口的 /debug-console/ 路径
    location / {
        # 代理到 Python 后端的 /debug-console/ 路径
        # 注意：末尾的斜杠很重要，会把 location 的 / 替换为 /debug-console/
        proxy_pass http://127.0.0.1:5000/debug-console/;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 告诉后端是 HTTPS

        # 处理后端返回的重定向（把 /debug-console/xxx 重写为 /xxx）
        proxy_redirect http://127.0.0.1:5000/debug-console/ /;
        proxy_redirect /debug-console/ /;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}


# ============================================================
