# ============================================================
# 路径映射说明
# ============================================================
# 
# 访问 https://your-domain:8080/          →  http://127.0.0.1:5000/debug-console/
# 访问 https://your-domain:8080/login     →  http://127.0.0.1:5000/debug-console/login
# 访问 https://your-domain:8080/terminal  →  http://127.0.0.1:5000/debug-console/terminal
# 访问 https://your-domain:8080/execute   →  http://127.0.0.1:5000/debug-console/execute
# 访问 https://your-domain:8080/logout    →  http://127.0.0.1:5000/debug-console/logout
#
# proxy_pass 末尾的斜杠确保了路径正确拼接


# ============================================================
# Session Cookie 说明
# ============================================================
# 
# 由于 Nginx 做了 HTTPS 卸载，Python 后端收到的是 HTTP 请求
# 当前配置 SESSION_COOKIE_SECURE = SSL_ENABLED（默认 false）
# 因此 session cookie 没有 Secure 标志，在 HTTPS 环境下也能正常工作
#
# 如果需要更高安全性（cookie 只在 HTTPS 下传输），可以：
# 1. 配置 Quart 信任代理：app.config['TRUSTED_PROXIES'] = ['127.0.0.1']
# 2. 或者直接设置 SESSION_COOKIE_SECURE = True
# 3. 确保 X-Forwarded-Proto header 正确传递（已配置）


# ============================================================
# Let's Encrypt 免费证书申请方法
# ============================================================
# 1. 安装 certbot:
#    sudo apt install certbot python3-certbot-nginx
#
# 2. 获取证书（需要先有一个 80 端口的 server 块用于验证）：
#    sudo certbot certonly --nginx -d your-domain.com
#
# 3. 证书路径通常在：
#    /etc/letsencrypt/live/your-domain.com/fullchain.pem
#    /etc/letsencrypt/live/your-domain.com/privkey.pem
#
# 4. 自动续期：certbot 会自动配置定时任务


# ============================================================
# Cloudflare 部署（可选）
# ============================================================
# 当把域名托管到 Cloudflare（橙云代理）后，访客真实 IP 由 Cloudflare 通过
# CF-Connecting-IP 头传递。后端 APIProxy 已内置识别逻辑（见 cloudflare.py），
# 默认 CLOUDFLARE_TRUSTED=auto：仅当连接来源 IP 属于 Cloudflare 官方段时
# 才采信 CF-Connecting-IP，避免直连源站伪造该头。
#
# 两种推荐拓扑：
#
# --- 拓扑 A：Cloudflare 直连 Python（无 nginx 反代主应用）---
# 无需额外配置，后端自动识别 CF-Connecting-IP。
# 务必在 Cloudflare 防火墙 / 服务器防火墙限制：仅允许 Cloudflare 边缘 IP
# 访问 5000 端口（否则攻击者可绕过 Cloudflare 直连源站伪造 IP）。
# Cloudflare 官方 IP 段：https://www.cloudflare.com/ips/
#
# --- 拓扑 B：Cloudflare → Nginx → Python ---
# 用 Nginx 的 real_ip 模块把 CF-Connecting-IP 还原为 remote_addr 再传给后端：
#
#   # 在 http 块中引入 Cloudflare 段（否则 set_real_ip_from 无效）
#   # 仅列出常用段，完整列表见 https://www.cloudflare.com/ips/
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   set_real_ip_from 103.22.200.0/22;
#   set_real_ip_from 103.31.4.0/22;
#   set_real_ip_from 141.101.64.0/18;
#   set_real_ip_from 108.162.192.0/18;
#   set_real_ip_from 190.93.240.0/20;
#   set_real_ip_from 188.114.96.0/20;
#   set_real_ip_from 197.234.240.0/22;
#   set_real_ip_from 198.41.128.0/17;
#   set_real_ip_from 162.158.0.0/15;
#   set_real_ip_from 104.16.0.0/13;
#   set_real_ip_from 104.24.0.0/14;
#   set_real_ip_from 172.64.0.0/13;
#   set_real_ip_from 131.0.72.0/22;
#   set_real_ip_from 2400:cb00::/32;
#   set_real_ip_from 2606:4700::/32;
#   set_real_ip_from 2803:f800::/32;
#   set_real_ip_from 2405:b500::/32;
#   set_real_ip_from 2405:8100::/32;
#   set_real_ip_from 2a06:98c0::/29;
#   set_real_ip_from 2c0f:f248::/32;
#   real_ip_header CF-Connecting-IP;
#
#   然后在主应用 location / 中：
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;          # 已被 real_ip 还原为真实访客 IP
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#
# 这样后端（拓扑 B）既可通过 X-Real-IP 拿到真实 IP，CF-Connecting-IP 也仍可用。
