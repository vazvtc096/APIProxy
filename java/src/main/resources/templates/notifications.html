<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知中心 - Cloud LLM API 代理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
               background: #f5f6f8; color: #1a1a1a; }
        .page-wrap { max-width: 760px; margin: 24px auto; padding: 0 16px; }
        .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .page-head h1 { font-size: 20px; }
        .btn-ghost { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 12px;
                     font-size: 13px; cursor: pointer; color: #2563eb; }
        .btn-ghost:hover { background: #f8fafc; }
        .notif-card { background: #fff; border: 1px solid #eef0f3; border-radius: 12px; overflow: hidden; }
        .notif-row { padding: 14px 16px; border-bottom: 1px solid #f3f4f6; border-left: 3px solid transparent; cursor: pointer; }
        .notif-row:last-child { border-bottom: none; }
        .notif-row:hover { background: #f9fafb; }
        .notif-row.unread { background: #f5f8ff; }
        .notif-row.critical { border-left-color: #ef4444; }
        .notif-row.warning { border-left-color: #f59e0b; }
        .notif-row.info { border-left-color: #3b82f6; }
        .notif-row .t { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .notif-row .b { font-size: 13px; color: #6b7280; line-height: 1.5; white-space: pre-wrap; }
        .notif-row .time { font-size: 12px; color: #9ca3af; margin-top: 6px; }
        .empty { padding: 48px 16px; text-align: center; color: #9ca3af; }
    </style>
</head>
<body>
    {% include "_navbar.html" %}
    <div class="page-wrap">
        <div class="page-head">
            <h1>通知中心</h1>
            <button class="btn-ghost" id="markAllBtn">全部标记为已读</button>
        </div>
        <div class="notif-card" id="notifContainer">
            <div class="empty">加载中…</div>
        </div>
    </div>
    <script nonce="{{ csp_nonce }}">
      function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
      async function loadList(){
        try{
          const r = await fetch('/api/notifications?limit=50');
          if(!r.ok) return;
          const d = await r.json();
          const c = document.getElementById('notifContainer');
          const list = d.notifications||[];
          if(!list.length){ c.innerHTML = '<div class="empty">暂无通知</div>'; return; }
          c.innerHTML = list.map(function(n){
            const lvl = n.level||'info';
            const link = n.link||'/notifications';
            return '<div class="notif-row '+(n.is_read?'read':'unread')+' '+lvl+'" data-nav="'+esc(link)+'">'+
                   '<div class="t">'+esc(n.title||'通知')+'</div>'+
                   '<div class="b">'+esc(n.body||'')+'</div>'+
                   '<div class="time">'+esc(n.created_at||'')+'</div></div>';
          }).join('');
        }catch(e){}
      }
      document.getElementById('markAllBtn').addEventListener('click', async function(){
        try{ await fetch('/api/notifications/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:'all'})}); await loadList(); }catch(e){}
      });
      if(document.readyState!=='loading') loadList(); else document.addEventListener('DOMContentLoaded', loadList);
    </script>
</body>
</html>
