<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - Cloud LLM API 代理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style nonce="{{ csp_nonce }}">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* 背景装饰 */
        .bg-decoration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 0;
        }
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }
        .bg-circle-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            top: -200px;
            right: -200px;
        }
        .bg-circle-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            bottom: -150px;
            left: -150px;
        }
        .bg-circle-3 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
        }
        /* 主容器 */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 48px 40px;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Logo 和标题 */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            font-size: 14px;
            color: #666;
        }
        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e5e7eb;
            transition: all 0.3s;
        }
        .step-dot.active {
            background: #667eea;
            transform: scale(1.2);
        }
        /* 表单 */
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
            background: #fafafa;
        }
        .form-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-input::placeholder {
            color: #9ca3af;
        }
        .form-hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }
        /* 按钮 */
        .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        /* 返回链接 */
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        /* 错误提示 */
        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.3s ease-out;
        }
        .error-message.show {
            display: block;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        /* 成功提示 */
        .success-message {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        /* 成功页面 */
        .success-page {
            text-align: center;
            padding: 20px 0;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .success-icon svg {
            width: 40px;
            height: 40px;
            color: #16a34a;
        }
        .success-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        .success-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }
        /* 页脚 */
        .auth-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: #9ca3af;
        }
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 步骤切换 */
        .step-pane {
            display: none;
        }
        .step-pane.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* 响应式 */
        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }
            .auth-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
    </div>
    <!-- 主卡片 -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h1 class="auth-title">重置密码</h1>
                <p class="auth-subtitle">通过邮箱验证重置你的密码</p>
            </div>

            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step-dot active" id="stepDot1"></div>
                <div class="step-dot" id="stepDot2"></div>
                <div class="step-dot" id="stepDot3"></div>
            </div>

            <!-- 消息提示 -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- 步骤1：输入用户名 -->
            <div class="step-pane active" id="step1">
                <form id="step1Form">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" id="username" placeholder="请输入你的用户名" autocomplete="username">
                    </div>
                    <button type="submit" class="btn-primary" id="step1Btn">
                        <span id="step1BtnText">发送验证码</span>
                    </button>
                </form>
                <div class="back-link">
                    <a href="/login">← 返回登录</a>
                </div>
            </div>

            <!-- 步骤2：输入验证码和新密码 -->
            <div class="step-pane" id="step2">
                <form id="step2Form">
                    <div class="form-group">
                        <label class="form-label">验证码</label>
                        <input type="text" class="form-input" id="code" placeholder="请输入 6 位验证码" maxlength="6">
                        <div class="form-hint">验证码已发送到你的邮箱，5 分钟内有效</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">新密码</label>
                        <input type="password" class="form-input" id="newPassword" placeholder="请输入新密码（至少 6 位，包含字母和数字）" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认新密码</label>
                        <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入新密码" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary" id="step2Btn">
                        <span id="step2BtnText">重置密码</span>
                    </button>
                </form>
                <div class="back-link">
                    <a href="#" data-action="backToStep1">← 重新发送验证码</a>
                </div>
            </div>

            <!-- 步骤3：成功 -->
            <div class="step-pane" id="step3">
                <div class="success-page">
                    <div class="success-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <h2 class="success-title">密码重置成功</h2>
                    <p class="success-desc">你的密码已成功重置，请使用新密码登录</p>
                    <a href="/login" class="btn-primary" style="display: block; text-decoration: none;">去登录</a>
                </div>
            </div>

            <div class="auth-footer">
                © 2024 Cloud LLM API 代理. All rights reserved.
            </div>
        </div>
    </div>
    <script nonce="{{ csp_nonce }}">
        let currentUsername = '';

        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        function setButtonLoading(btn, loading, text) {
            const btnText = btn.querySelector('span');
            if (loading) {
                btn.disabled = true;
                btnText.innerHTML = '<span class="loading"></span>';
            } else {
                btn.disabled = false;
                btnText.textContent = text;
            }
        }

        function goToStep(step) {
            document.querySelectorAll('.step-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelectorAll('.step-dot').forEach(dot => dot.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            document.getElementById('stepDot' + step).classList.add('active');
            hideMessages();
        }

        function backToStep1() {
            goToStep(1);
            document.getElementById('step1Form').reset();
        }

        // 步骤1：发送验证码
        document.getElementById('step1Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const username = document.getElementById('username').value.trim();
            const btn = document.getElementById('step1Btn');

            if (!username) {
                showError('请输入用户名');
                return;
            }

            setButtonLoading(btn, true, '发送中');

            try {
                const response = await fetch('/api/password-reset/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUsername = username;
                    showSuccess('验证码已发送，请查收邮箱');
                    setTimeout(() => {
                        goToStep(2);
                    }, 1000);
                } else {
                    showError(data.error || '发送失败');
                }
            } catch (e) {
                showError('网络错误，请稍后重试');
            } finally {
                setButtonLoading(btn, false, '发送验证码');
            }
        });

        // 步骤2：重置密码
        document.getElementById('step2Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const code = document.getElementById('code').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('step2Btn');

            if (!code) {
                showError('请输入验证码');
                return;
            }

            if (newPassword.length < 6) {
                showError('密码至少 6 位');
                return;
            }

            if (!/[a-zA-Z]/.test(newPassword)) {
                showError('密码必须包含字母');
                return;
            }

            if (!/[0-9]/.test(newPassword)) {
                showError('密码必须包含数字');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            setButtonLoading(btn, true, '重置中');

            try {
                const response = await fetch('/api/password-reset/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUsername,
                        code: code,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    goToStep(3);
                } else {
                    showError(data.error || '重置失败');
                }
            } catch (e) {
                showError('网络错误，请稍后重试');
            } finally {
                setButtonLoading(btn, false, '重置密码');
            }
        });
    </script>
</body>
</html>
