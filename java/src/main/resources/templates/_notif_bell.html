{# 通知铃铛：右上角统一入口。公告/系统通知写入 notifications 表后在此实时展示。 #}
{# 与好友关系解耦——admin 不再需要作为「虚拟好友」承载通知。文档页不含共享导航，天然排除。 #}
<style>
  .notif-bell { position: relative; display: inline-flex; align-items: center; margin-right: 4px; }
  .notif-bell .bell-btn {
    position: relative; background: transparent; border: none; cursor: pointer;
    color: #4b5563; font-size: 20px; line-height: 1; padding: 6px; border-radius: 8px;
  }
  .notif-bell .bell-btn:hover { background: #f3f4f6; color: #1f2937; }
  .notif-badge {
    position: absolute; top: 0; right: 0; min-width: 16px; height: 16px; padding: 0 4px;
    background: #ef4444; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 600;
    display: none; align-items: center; justify-content: center; transform: translate(25%, -25%);
  }
  .notif-panel {
    position: absolute; top: 46px; right: 0; width: 360px; max-width: 92vw; max-height: 70vh;
    overflow-y: auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.14); z-index: 1200; display: none;
  }
  .notif-panel.show { display: block; }
  .notif-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; background: #fff;
  }
  .notif-header h4 { margin: 0; font-size: 14px; color: #111827; }
  .notif-markall {
    background: none; border: none; color: #2563eb; font-size: 12px; cursor: pointer; padding: 4px 6px;
  }
  .notif-item {
    padding: 10px 14px; border-bottom: 1px solid #f8fafc; cursor: pointer; border-left: 3px solid transparent;
  }
  .notif-item:hover { background: #f9fafb; }
  .notif-item.unread { background: #f5f8ff; }
  .notif-item.critical { border-left-color: #ef4444; }
  .notif-item.warning { border-left-color: #f59e0b; }
  .notif-item.info { border-left-color: #3b82f6; }
  .notif-title { font-size: 13px; font-weight: 600; color: #111827; margin-bottom: 2px; }
  .notif-body { font-size: 12px; color: #6b7280; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .notif-time { font-size: 11px; color: #9ca3af; margin-top: 4px; }
  .notif-empty { padding: 28px 14px; text-align: center; color: #9ca3af; font-size: 13px; }
</style>

<div class="notif-bell" id="notifBell">
  <button class="bell-btn" type="button" data-action="toggleNotif" title="通知">
    <i class="bi bi-bell"></i>
    <span class="notif-badge" id="notifBadge">0</span>
  </button>
  <div class="notif-panel" id="notifPanel">
    <div class="notif-header">
      <h4>通知</h4>
      <button class="notif-markall" type="button" data-action="markAllNotif">全部已读</button>
    </div>
    <div id="notifList"><div class="notif-empty">加载中…</div></div>
  </div>
</div>

<script nonce="{{ csp_nonce }}">
  (function () {
    function notifEscape(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    async function loadNotifBell() {
      try {
        const r = await fetch('/api/notifications?limit=20');
        if (!r.ok) return;
        const d = await r.json();
        renderNotifBell(d.notifications || [], d.unread_count || 0);
      } catch (e) { /* ignore */ }
    }
    function renderNotifBell(list, unread) {
      const badge = document.getElementById('notifBadge');
      if (badge) {
        if (unread > 0) { badge.style.display = 'inline-flex'; badge.textContent = unread > 99 ? '99+' : String(unread); }
        else badge.style.display = 'none';
      }
      const panel = document.getElementById('notifList');
      if (!panel) return;
      if (!list.length) { panel.innerHTML = '<div class="notif-empty">暂无通知</div>'; return; }
      panel.innerHTML = list.map(function (n) {
        const lvl = n.level || 'info';
        const cls = 'notif-item ' + lvl + ' ' + (n.is_read ? 'read' : 'unread');
        const link = n.link ? notifEscape(n.link) : '/notifications';
        const body = notifEscape((n.body || '').slice(0, 140));
        const title = notifEscape(n.title || '通知');
        return '<div class="' + cls + '" data-nav="' + link + '">' +
                 '<div class="notif-title">' + title + '</div>' +
                 '<div class="notif-body">' + body + '</div>' +
                 '<div class="notif-time">' + notifEscape(n.created_at || '') + '</div>' +
               '</div>';
      }).join('');
    }
    window.__toggleNotif = function () {
      const p = document.getElementById('notifPanel');
      if (p) p.classList.toggle('show');
    };
    window.__markAllNotif = async function () {
      try {
        await fetch('/api/notifications/read', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: 'all' })
        });
        await loadNotifBell();
      } catch (e) { /* ignore */ }
    };
    document.addEventListener('click', function (e) {
      const nb = document.querySelector('.notif-bell');
      const p = document.getElementById('notifPanel');
      if (nb && p && !nb.contains(e.target)) p.classList.remove('show');
    });
    // 事件委托：铃铛按钮与「全部已读」走 data-action，与全局事件框架一致
    document.addEventListener('click', function (e) {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const a = el.getAttribute('data-action');
      if (a === 'toggleNotif') { e.preventDefault(); window.__toggleNotif(); }
      else if (a === 'markAllNotif') { e.preventDefault(); window.__markAllNotif(); }
    });
    document.addEventListener('DOMContentLoaded', loadNotifBell);
    if (document.readyState !== 'loading') loadNotifBell();
    setInterval(loadNotifBell, 30000);
    // 复用全站未读 SSE / 轮询事件，红点实时刷新
    document.addEventListener('unread-update', function () { loadNotifBell(); });
  })();
</script>
