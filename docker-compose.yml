# ============================================================================
# APIProxy 编排配置
# 启动前：复制 .env.example 为 .env，填入必填密钥
#   cp .env.example .env   （编辑 OAUTH_JWT_SECRET 等）
#   docker compose up -d
#
# 可选监控栈（Prometheus + Alertmanager）：
#   docker compose --profile monitoring up -d
# ============================================================================

services:
  apiproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: apiproxy:latest
    container_name: apiproxy
    restart: unless-stopped
    # 优雅停机：与 Hypercorn GRACEFUL_TIMEOUT(30s) 对齐，给在途请求留足收尾时间
    stop_grace_period: 40s
    # PID 1 信号转发 / 回收僵尸进程
    init: true
    ports:
      - "5000:5000"    # HTTP 主服务
      - "5001:5001"    # Debug Console 远程控制台（TLS）
      # - "5443:5443"  # HTTPS（启用 APIPROXY_SSL_ENABLED=true 后放开）
    environment:
      # ---- 必填：OAuth JWT 签名密钥（fail-closed，缺失拒启）----
      # 生成：python -c "import secrets; print(secrets.token_hex(32))"
      APIPROXY_OAUTH_JWT_SECRET: ${APIPROXY_OAUTH_JWT_SECRET:?请在 .env 中设置 APIPROXY_OAUTH_JWT_SECRET}

      # ---- 上游 API Key（按 upstream 名称注入，覆盖 config.yaml 空值）----
      # 规则：APIPROXY_UPSTREAM_<NAME 大写、- 转 _>_API_KEY
      APIPROXY_UPSTREAM_DEEPSEEK_MAIN_API_KEY: ${APIPROXY_UPSTREAM_DEEPSEEK_MAIN_API_KEY:-}

      # ---- 数据库路径（指向持久卷）----
      DB_PATH: /data/users.db
      # ---- 数据库后端：sqlite（默认）| postgres ----
      DB_TYPE: ${DB_TYPE:-sqlite}
      # PostgreSQL 连接串（DB_TYPE=postgres 时必填，如另起 postgres 服务）
      # DATABASE_URL: ${DATABASE_URL:-}
      # ---- Redis（可选：限流/会话缓存加速）----
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # ---- 可选：SMTP（邮箱验证 / 找回密码）----
      # APIPROXY_SMTP_USER: ${SMTP_USER:-}
      # APIPROXY_SMTP_PASS: ${SMTP_PASS:-}

      # ---- 可选：HTTPS ----
      # APIPROXY_SSL_ENABLED: "true"
      # APIPROXY_HTTPS_PORT: "5443"

      TZ: Asia/Shanghai

    volumes:
      - apiproxy_data:/data              # 数据库持久化
      # 可选：挂载自定义配置（覆盖镜像内置 config.yaml）
      # - ./config.yaml:/opt/apiproxy/APIProxy/config.yaml:ro
      # 可选：挂载自定义 TLS 证书
      # - ./certs:/opt/apiproxy/APIProxy/certs:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read(); sys.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s   # 启动含 DB 迁移 + 自检，约 70s 才监听，留足余量

    # 资源上限：防止单容器吃满宿主（含内存泄漏兜底）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.25"
          memory: 256m

    # 日志轮转：避免 json-file 日志无限增长撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:
      # Redis 健康后再启动主服务（Redis 仅作限流/缓存加速，缺失会回退本地 C 限流）
      redis:
        condition: service_healthy

    networks:
      - backend

  # 可选：Redis（限流/会话缓存加速）。apiproxy 服务通过 REDIS_URL 引用。
  redis:
    image: redis:7-alpine
    container_name: apiproxy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # 可选监控栈：docker compose --profile monitoring up -d
  # 抓取 apiproxy /metrics，按 prometheus_alerts.yml 规则评估并外发 Alertmanager
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: apiproxy-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - alertmanager
    networks:
      - backend

  alertmanager:
    image: prom/alertmanager:latest
    container_name: apiproxy-alertmanager
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - backend

volumes:
  apiproxy_data:
  redis_data:
  prometheus_data:
  alertmanager_data:

networks:
  # 独立桥接网络：监控栈与业务隔离在自定义网络内，不依赖默认 bridge
  backend:
    driver: bridge
