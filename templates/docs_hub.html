<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档中心</title>
<style nonce="{{ csp_nonce }}">
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif; background:#f7f8fa; color:#1a1a1a; line-height:1.7; }
  .doc-shell { display:flex; min-height:100vh; }
  .doc-sidebar { width:240px; flex:0 0 240px; background:#fff; border-right:1px solid #e5e7eb; padding:24px 16px; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; }
  .doc-brand { font-size:16px; font-weight:700; color:#1a1a1a; padding:0 12px 20px; }
  .doc-nav-title { font-size:12px; font-weight:600; color:#9ca3af; text-transform:uppercase; letter-spacing:.5px; padding:0 12px; margin:8px 0; }
  .doc-nav-link { display:block; padding:9px 12px; border-radius:8px; color:#444; text-decoration:none; font-size:14px; margin-bottom:2px; }
  .doc-nav-link:hover { background:#f3f4f6; color:#1a1a1a; }
  .doc-nav-link.active { background:#eef2ff; color:#667eea; font-weight:600; }
  .doc-main { margin-left:240px; flex:1; padding:40px; }
  .doc-content { max-width:880px; margin:0 auto; }
  .doc-content h1 { font-size:30px; margin-bottom:8px; }
  .doc-content .sub { color:#666; margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .card { display:block; text-decoration:none; background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:24px; color:#1a1a1a; transition:border-color .15s, transform .15s, box-shadow .15s; }
  .card:hover { border-color:#667eea; transform:translateY(-2px); box-shadow:0 6px 20px rgba(102,126,234,.12); }
  .card h2 { margin:0 0 8px; font-size:18px; color:#667eea; }
  .card p { margin:0; color:#666; font-size:14px; line-height:1.6; }
  .tag { display:inline-block; font-size:12px; color:#666; border:1px solid #e5e7eb; border-radius:999px; padding:2px 10px; margin-bottom:12px; }
  @media (max-width:768px) { .doc-sidebar { display:none; } .doc-main { margin-left:0; padding:20px; } }
</style>
</head>
<body>
<div class="doc-shell">
  <aside class="doc-sidebar">
    <div class="doc-brand">Cloud LLM API 代理</div>
    <div class="doc-nav-title">文档</div>
    <a class="doc-nav-link active" href="/docs">文档中心</a>
    {% for d in docs %}
    <a class="doc-nav-link" href="/docs/{{ d.slug }}" target="_blank" rel="noopener">{{ d.title }}</a>
    {% endfor %}
  </aside>
  <main class="doc-main">
    <div class="doc-content">
      <h1>文档中心</h1>
      <p class="sub">本站提供的文档如下：</p>
      <div class="grid">
        {% for d in docs %}
        <a class="card" href="/docs/{{ d.slug }}" target="_blank" rel="noopener">
          <span class="tag">公开</span>
          <h2>{{ d.title }}</h2>
          <p>{{ d.intro or '点击查看文档。' }}</p>
        </a>
        {% endfor %}
      </div>
    </div>
  </main>
</div>
</body>
</html>
