    }
    .sidebar-group-body { display: none; }
    .sidebar-group.open .sidebar-group-body { display: block; }
    .sidebar-group-body .sidebar-item { padding-left: 24px; }
</style>

<script nonce="{{ csp_nonce }}">
    // 未读红点（聊天未读 + 公告未读、待处理好友请求）——全站统一，单一数据来源
    async function refreshUnread() {
        try {
            const r = await fetch('/api/chat/unread');
            if (!r.ok) return;
            const d = await r.json();
            applyUnread(d);
        } catch (e) { /* ignore */ }
    }

    // 把未读快照应用到红点（同时供 SSE 与轮询复用）
    function applyUnread(d) {
        if (!d) return;
        const chat = (d.unread_count || 0) + (d.announcement_unread || 0);
        const friends = d.friend_requests || 0;
        document.querySelectorAll('[data-unread="chat"]').forEach(el => {
            if (chat > 0) { el.style.display = 'inline-flex'; el.textContent = chat > 99 ? '99+' : String(chat); }
            else el.style.display = 'none';
        });
        document.querySelectorAll('[data-unread="friends"]').forEach(el => {
            if (friends > 0) { el.style.display = 'inline-flex'; el.textContent = friends > 99 ? '99+' : String(friends); }
            else el.style.display = 'none';
        });
        // 广播给其它页面模块（如聊天页）做实时刷新
        document.dispatchEvent(new CustomEvent('unread-update', { detail: d }));
    }

    // 通过统一 SSE 长连接接收未读 + 用户信息（替代每 15s 轮询 /api/chat/unread 与每页 fetch /userinfo）
    function connectUnreadStream() {
        if (typeof EventSource === 'undefined') {
            refreshUnread();
            setInterval(refreshUnread, 15000);
            // 无 SSE 能力时，用户信息回退一次性拉取
            if (!window.__userinfoFallback) {
                window.__userinfoFallback = true;
                fetch('/userinfo').then(r => r.ok ? r.json() : null).then(d => {
                    if (d) { window.userInfo = d; document.dispatchEvent(new CustomEvent('userinfo-update', { detail: d })); }
                }).catch(() => {});
            }
            return;
        }
        const es = new EventSource('/api/stream');
        es.addEventListener('unread', function (ev) {
            window.__unreadSSEAlive = true;
            try { applyUnread(JSON.parse(ev.data)); } catch (e) { /* ignore */ }
        });
        es.addEventListener('userinfo', function (ev) {
            window.__unreadSSEAlive = true;
            try {
                const d = JSON.parse(ev.data);
                // 完整性校验：缺关键字段的快照不消费，避免把残缺数据写进 window.userInfo
                if (!d || !d.username) return;
                window.userInfo = d;
                document.dispatchEvent(new CustomEvent('userinfo-update', { detail: d }));
            } catch (e) { /* ignore */ }
        });
        es.addEventListener('notifications', function (ev) {
            window.__unreadSSEAlive = true;
            try {
                const d = JSON.parse(ev.data);
                document.dispatchEvent(new CustomEvent('notifications-update', { detail: d }));
            } catch (e) { /* ignore */ }
        });
        es.onerror = function () {
            window.__unreadSSEAlive = false;
            es.close();
            // SSE 不可用时降级为轮询
            refreshUnread();
            setInterval(refreshUnread, 15000);
        };
    }

    // 全局：等待用户信息就绪。优先消费 SSE 推送的 window.userInfo；SSE 未连上时兜底拉一次 /userinfo。
    // 供各页面替代原先的 fetch('/userinfo')，消除每页一次的请求噪音。
    // 并发调用共享同一 in-flight Promise，避免导航栏 + 多个页面脚本同时兜底拉取造成重复请求。
    window.getUserInfo = function () {
        if (window.userInfo) return Promise.resolve(window.userInfo);
        if (window.__userInfoPromise) return window.__userInfoPromise;
        window.__userInfoPromise = new Promise((resolve) => {
            let done = false;
            const finish = (d) => {
                if (done) return;
                done = true;
                document.removeEventListener('userinfo-update', handler);
                resolve(d);
            };
            const handler = (e) => finish(e.detail);
            document.addEventListener('userinfo-update', handler);
            // SSE 不可用兜底：1.5s 内仍未收到则直接拉取
            setTimeout(async () => {
                if (done) return;
                try {
                    const r = await fetch('/userinfo');
                    if (r.ok) {
                        const d = await r.json();
                        if (d && d.username) {
                            window.userInfo = d;
                            finish(d);
                            return;
                        }
                    }
                } catch (e) { /* ignore */ }
                finish(null);
            }, 1500);
        });
        return window.__userInfoPromise;
    };

    // 管理员分区：根据登录态统一显隐（所有页面一致）
    async function revealAdminSection() {
        let isAdmin = window.userInfo && window.userInfo.is_admin;
        let mustPw = window.userInfo && window.userInfo.must_change_password;
        if (isAdmin === undefined || isAdmin === null || mustPw === undefined) {
            // 优先消费统一 SSE 推送的 window.userInfo（兜底由 getUserInfo 内部一次性拉取）
            try {
                const d = await window.getUserInfo();
                if (d) { isAdmin = d.is_admin; mustPw = d.must_change_password; }
            } catch (e) { /* ignore */ }
        }
        if (isAdmin) {
            const s = document.getElementById('adminSection');
            if (s) s.style.display = 'block';
        }
        // 强制改密引导横幅
        if (mustPw) {
            const b = document.getElementById('pwBanner');
            if (b) b.style.display = 'block';
        }
        // 等管理员分区显隐确定后，再决定展开哪个分组
        setTimeout(initSidebarGroups, 0);
    }

    // ---------- 文件夹式分组（手风琴） ----------
    var _GROUP_KEY = 'apiproxy_sidebar_group';
    // 展开/折叠某个组：每次只展开一个组
    function toggleSidebarGroup(name) {
        // 事件委托传入的 data-args 是原始字符串（不会当 JS 字面量求值），
        // 若调用处误带引号（如 'social'），去掉首尾引号以保证与 data-group 精确匹配。
        name = String(name == null ? '' : name).replace(/^['"]|['"]$/g, '');
        var groups = document.querySelectorAll('.sidebar-group');
        var targetOpen = true;
        groups.forEach(function (g) {
            var isTarget = g.getAttribute('data-group') === name;
            // 目标组若非管理员可见则忽略
            if (isTarget && g.style.display === 'none') { targetOpen = false; return; }
            if (isTarget) targetOpen = !g.classList.contains('open');
        });
        groups.forEach(function (g) {
            var isTarget = g.getAttribute('data-group') === name;
            var open = isTarget ? targetOpen : false;
            g.classList.toggle('open', open);
            var arrow = g.querySelector('.group-arrow');
            if (arrow) arrow.style.transform = open ? 'rotate(0deg)' : 'rotate(-90deg)';
        });
        try { localStorage.setItem(_GROUP_KEY, targetOpen ? name : ''); } catch (e) {}
    }
    // 初始化：展开上次保存的组；无保存记录时展开当前 active 项所在组（active 在固定区则展开第一个可见组）
    function initSidebarGroups() {
        var saved = null;
        try { saved = localStorage.getItem(_GROUP_KEY); } catch (e) {}
        var activeItem = document.querySelector('.sidebar-group .sidebar-item.active');
        var activeGroup = activeItem ? activeItem.closest('.sidebar-group') : null;
        // 当前页 active 项所在组优先于上次保存的组（否则从其他分组页面跳转过来时，高亮项所在组不展开）
        var target = activeGroup ? activeGroup.getAttribute('data-group') : ((saved && saved !== '') ? saved : '');
        var groups = Array.prototype.slice.call(document.querySelectorAll('.sidebar-group'));
        // 若目标组不可见（如非管理员时保存的是 admin），回退到第一个可见组
        var visibleGroups = groups.filter(function (g) { return g.style.display !== 'none'; });
        if (!visibleGroups.length) return;
        var targetVisible = groups.some(function (g) { return g.getAttribute('data-group') === target && g.style.display !== 'none'; });
        if (!target || !targetVisible) target = visibleGroups[0].getAttribute('data-group');
        groups.forEach(function (g) {
            var open = g.getAttribute('data-group') === target;
            g.classList.toggle('open', open);
            var arrow = g.querySelector('.group-arrow');
            if (arrow) arrow.style.transform = open ? 'rotate(0deg)' : 'rotate(-90deg)';
        });
    }

    // 侧边栏滚动位置持久化：切换页签（整页重载）后保持原滚动位置
    (function () {
        const sb = document.querySelector('.sidebar');
        if (!sb) return;
        const KEY = 'apiproxy_sidebar_scroll';
        const save = () => { try { sessionStorage.setItem(KEY, String(sb.scrollTop)); } catch (e) {} };
        sb.addEventListener('scroll', save, { passive: true });
        sb.addEventListener('click', save);
        window.addEventListener('beforeunload', save);
        try {
            const p = parseInt(sessionStorage.getItem(KEY) || '0', 10);
            if (p > 0) sb.scrollTop = p;
        } catch (e) {}
    })();

    // ========================================================================
    // data-action 事件委托（兜底实现）
    // 权威实现由 security_middleware 注入到每个 HTML 响应的 body 结束标签前，并置
    // window.__actionDelegationInstalled = true。本实现仅在其缺失时（如响应未被注入）
    // 接管；检测到标记时直接跳过，避免同一次点击被两套委托各执行一次。
    //
    // 注意两套实现的参数顺序不同：权威实现为 fn(...args, el)，本兜底实现为 fn(el, ...args)。
    // 既有模板（如 community.html 的 toggleFavorite(postId, btn)）按权威实现的顺序编写，
    // 因此新代码一律以「权威实现」为准，不要依赖本兜底的顺序。
    // ========================================================================
    (function () {
        function _parseArgs(str) {
            if (!str) return [];
            try {
                const p = JSON.parse(str);
                return Array.isArray(p) ? p : [p];
            } catch (e) {
                let parts;
                if (str.indexOf('\u0001') !== -1) {
                    parts = str.split('\u0001');
                } else if (str.indexOf(',') !== -1) {
                    parts = str.split(',');
                } else {
                    parts = [str];
                }
                return parts.map(function (s) {
                    s = s.trim();
                    if (s.length >= 2 && s.charAt(0) === "'" && s.charAt(s.length - 1) === "'") {
                        s = s.slice(1, -1);
                    }
                    return s;
                });
            }
        }
        function _handle(e) {
            // 权威委托已安装（正常情况）：本兜底直接让位，避免重复执行
            if (window.__actionDelegationInstalled) return;
            if (!e.target || typeof e.target.closest !== 'function') return;
            const el = e.target.closest('[data-action]');
            if (!el) return;
            const action = el.getAttribute('data-action');
            if (!action) return;
            const onEvent = el.getAttribute('data-on') || 'click';
            if (e.type !== onEvent) return;
            if (el.hasAttribute('data-stop')) e.stopPropagation();
            // 仅对链接/按钮/表单元素阻止默认行为，避免干扰 div 等普通元素
            if (el.tagName === 'A' || el.tagName === 'BUTTON' || el.tagName === 'INPUT' || el.tagName === 'FORM' || el.closest('form')) {
                e.preventDefault();
            }
            let args = [];
            if (el.hasAttribute('data-arg-this')) args.push(el);
            const rawArgs = el.getAttribute('data-args');
            if (rawArgs) args = args.concat(_parseArgs(rawArgs));
            const fn = window[action];
            if (typeof fn !== 'function') {
                console.warn('[data-action] 函数不存在:', action);
                return;
            }
            const result = fn.apply(el, args);
            const thenAction = el.getAttribute('data-then');
            if (thenAction && typeof window[thenAction] === 'function') {
                const thenArgs = _parseArgs(el.getAttribute('data-then-args') || '');
                if (result && typeof result.then === 'function') {
                    result.then(function () { window[thenAction].apply(el, thenArgs); });
                } else {
                    window[thenAction].apply(el, thenArgs);
                }
            }
        }
        document.addEventListener('click', _handle);
        document.addEventListener('input', _handle);
    })();

    function _sidebarInit() {
        initSidebarGroups();          // 直接初始化分组展开状态（不依赖 /userinfo 请求结果）
        connectUnreadStream();
        revealAdminSection();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _sidebarInit);
    } else {
        _sidebarInit();
    }
</script>
