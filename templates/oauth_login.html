<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录以授权</title>
<style nonce="{{ csp_nonce }}">
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background:#f6f8fa; color:#1f2328; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding-top:8vh; }
  .wrap { width:340px; }
  .avatar { width:48px; height:48px; border:1px solid rgba(27,31,36,.15); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; background:#fff; color:#1f2328; }
  .card { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:24px; text-align:center; }
  h1 { font-size:18px; font-weight:600; margin-bottom:8px; }
  .client-box { background:#f6f8fa; border:1px solid #d0d7de; border-radius:6px; padding:12px; margin-bottom:18px; font-size:13px; color:#1f2328; text-align:left; }
  .err { background:#ffebe9; color:#cf222e; border:1px solid rgba(207,34,46,.4); padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:14px; text-align:left; }
  .field { display:flex; flex-direction:column; gap:6px; text-align:left; margin-bottom:14px; }
  label { font-size:13px; font-weight:600; color:#1f2328; }
  input { padding:10px 12px; border:1px solid #d0d7de; border-radius:6px; font-size:14px; outline:none; font-family:inherit; }
  input:focus { border-color:#0969da; box-shadow:0 0 0 3px rgba(9,105,218,.25); }
  .btn { width:100%; padding:11px; border:1px solid rgba(27,31,36,.15); border-radius:6px; background:#1f883d; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { background:#1a7f37; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="avatar"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3zm-3 5a2 2 0 0 1 1 3.73V20a1 1 0 0 1-2 0v-2.27A2 2 0 0 1 12 14z"></path></svg></div>
    <div class="card">
      <h1>登录以授权</h1>
      <div class="client-box">应用 <b>{{ client.client_name }}</b> 请求访问你的账号，请先登录。</div>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="POST" action="/oauth/authorize">
        <input type="hidden" name="client_id" value="{{ client_id }}">
        <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
        <input type="hidden" name="response_type" value="{{ response_type }}">
        <input type="hidden" name="scope" value="{{ scope }}">
        <input type="hidden" name="state" value="{{ state }}">
        <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
        <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
        <div class="field">
          <label>用户名</label>
          <input type="text" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit">登录并继续</button>
      </form>
    </div>
  </div>
</body>
</html>
