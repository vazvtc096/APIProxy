<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ doc.title }}</title>
<style nonce="{{ csp_nonce }}">
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif; color:#1a1a1a; background:#f7f8fa; line-height:1.7; }
  .doc-shell { display:flex; min-height:100vh; }
  .doc-sidebar { width:240px; flex:0 0 240px; background:#fff; border-right:1px solid #e5e7eb; padding:24px 16px; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; }
  .doc-brand { font-size:16px; font-weight:700; color:#1a1a1a; padding:0 12px 20px; }
  .doc-nav-title { font-size:12px; font-weight:600; color:#9ca3af; text-transform:uppercase; letter-spacing:.5px; padding:0 12px; margin:8px 0; }
  .doc-nav-link { display:block; padding:9px 12px; border-radius:8px; color:#444; text-decoration:none; font-size:14px; margin-bottom:2px; }
  .doc-nav-link:hover { background:#f3f4f6; color:#1a1a1a; }
  .doc-nav-link.active { background:#eef2ff; color:#667eea; font-weight:600; }
  .doc-body { display:flex; margin-left:240px; }
  .doc-main { flex:1; padding:40px; min-width:0; }
  .doc-content { max-width:820px; margin:0 auto; background:#fff; padding:40px 48px; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .doc-content h1 { font-size:30px; margin-bottom:8px; }
  .doc-intro { background:#f8fafc; border:1px solid #eef2f7; border-left:3px solid #667eea; border-radius:8px; padding:14px 16px; margin:0 0 28px; color:#555; font-size:14px; }
  .doc-content h2 { font-size:22px; margin:32px 0 12px; padding-bottom:8px; border-bottom:1px solid #eee; scroll-margin-top:20px; }
  .doc-content h3 { font-size:17px; margin:22px 0 10px; }
  .doc-content p { margin:10px 0; color:#333; }
  .doc-content ul, .doc-content ol { margin:10px 0 10px 24px; }
  .doc-content li { margin:4px 0; }
  .doc-content code { background:#f3f4f6; padding:2px 6px; border-radius:5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .doc-content pre { background:#0f172a; color:#e2e8f0; padding:16px 18px; border-radius:10px; overflow:auto; margin:12px 0; }
  .doc-content pre code { background:transparent; color:inherit; padding:0; }
  .doc-content table { width:100%; border-collapse:collapse; margin:14px 0; font-size:14px; }
  .doc-content th, .doc-content td { border:1px solid #e5e7eb; padding:10px 12px; text-align:left; }
  .doc-content th { background:#fafafa; }
  .doc-toc { width:220px; flex:0 0 220px; padding:40px 16px; }
  .doc-toc .toc-title { font-size:12px; font-weight:600; color:#9ca3af; text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
  .doc-toc a { display:block; padding:6px 12px; color:#555; text-decoration:none; font-size:13px; border-radius:6px; border-left:2px solid #e5e7eb; }
  .doc-toc a:hover { background:#f3f4f6; color:#1a1a1a; }
  @media (max-width:1080px) { .doc-toc { display:none; } }
  @media (max-width:768px) { .doc-sidebar { display:none; } .doc-body { margin-left:0; } .doc-main { padding:20px; } .doc-content { padding:24px; } }
</style>
</head>
<body>
<div class="doc-shell">
  <aside class="doc-sidebar">
    <div class="doc-brand">Cloud LLM API 代理</div>
    <div class="doc-nav-title">文档</div>
    <a class="doc-nav-link" href="/docs" target="_blank" rel="noopener">文档中心</a>
    {% for d in docs %}
    <a class="doc-nav-link{% if d.slug == active %} active{% endif %}" href="/docs/{{ d.slug }}" target="_blank" rel="noopener">{{ d.title }}</a>
    {% endfor %}
  </aside>
  <div class="doc-body">
    <main class="doc-main">
      <div class="doc-content">
        <h1>{{ doc.title }}</h1>
        {% if doc.intro %}<div class="doc-intro">{{ doc.intro }}</div>{% endif %}
        {{ doc.html|safe }}
      </div>
    </main>
    {% if doc.toc %}
    <nav class="doc-toc">
      <div class="toc-title">本页目录</div>
      {% for t in doc.toc %}
      <a href="#h2-{{ loop.index }}">{{ t }}</a>
      {% endfor %}
    </nav>
    {% endif %}
  </div>
</div>
</body>
</html>
