<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCON Web 控制台 - 登录</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style nonce="{{ csp_nonce }}">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo-icon i {
            font-size: 32px;
            color: white;
        }
        .logo-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .logo-subtitle {
            font-size: 14px;
            color: #666;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-input::placeholder {
            color: #9ca3af;
        }
        .form-divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #9ca3af;
            font-size: 12px;
        }
        .form-divider::before,
        .form-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .form-divider span {
            padding: 0 12px;
        }
        .btn-login {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .security-notice {
            margin-top: 24px;
            padding: 16px;
            background: #f0f2ff;
            border-radius: 12px;
            font-size: 12px;
            color: #667eea;
            line-height: 1.6;
        }
        .security-notice i {
            margin-right: 6px;
        }
        .security-notice strong {
            display: block;
            margin-bottom: 4px;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-terminal-fill"></i>
            </div>
            <h1 class="logo-title">RCON Web 控制台</h1>
            <p class="logo-subtitle">远程管理终端 - 最高权限</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <form id="loginForm" data-on="submit" data-prevent>
            <div class="form-group">
                <label class="form-label" for="username">管理员用户名</label>
                <input 
                    type="text" 
                    id="username" 
                    class="form-input" 
                    placeholder="请输入管理员用户名"
                    autocomplete="username"
                    autofocus
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">管理员密码</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="请输入管理员密码"
                    autocomplete="current-password"
                >
            </div>
            
            <div class="form-divider">
                <span>RCON 密钥</span>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="rconKey">RCON 密钥</label>
                <input 
                    type="password" 
                    id="rconKey" 
                    class="form-input" 
                    placeholder="请输入 RCON 密钥"
                    autocomplete="off"
                    style="font-family: 'JetBrains Mono', monospace;"
                >
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn" data-action="doLogin">
                <i class="bi bi-shield-lock"></i>
                <span>登录控制台</span>
            </button>
        </form>
        
        <div class="security-notice">
            <i class="bi bi-info-circle"></i>
            <strong>双重认证</strong>
            需要同时验证管理员账号和 RCON 密钥才能登录。RCON 拥有系统最高权限，请妥善保管密钥。
        </div>
        
        <div class="footer">
            RCON Web Console v2.0
        </div>
    </div>
    <script nonce="{{ csp_nonce }}">
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rconKeyInput = document.getElementById('rconKey');
        
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('show');
        }
        
        function hideError() {
            errorMessage.classList.remove('show');
        }
        
        async function doLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const rconKey = rconKeyInput.value.trim();
            
            if (!username || !password || !rconKey) {
                showError('请填写所有字段');
                return;
            }
            
            hideError();
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> <span>验证中...</span>';
            
            try {
                const response = await fetch('/rcon/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        key: rconKey
                    }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/rcon/terminal';
                } else {
                    showError(data.error || '登录失败，请检查信息');
                    passwordInput.value = '';
                    rconKeyInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                showError('连接失败，请稍后重试');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-shield-lock"></i> <span>登录控制台</span>';
            }
        }
        
        // 回车登录
        [usernameInput, passwordInput, rconKeyInput].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    doLogin();
                }
            });
        });
    </script>
</body>
</html>
