<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易记录 - 社区</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style nonce="{{ csp_nonce }}">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
        }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: white; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 100;
        }
        .navbar-left { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
        }
        .logo svg { width: 20px; height: 20px; color: white; }
        .logo-text { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .navbar-right { display: flex; align-items: center; gap: 16px; }
        .balence-display {
            display: flex; align-items: center; gap: 8px;
            background: #f0f2ff; padding: 8px 16px; border-radius: 20px;
        }
        .balence-icon { color: #667eea; font-size: 16px; }
        .balence-amount { font-size: 14px; font-weight: 600; color: #667eea; }
        .user-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 16px; cursor: pointer;
        }
        .main-container { display: flex; padding-top: 64px; min-height: 100vh; }
        .sidebar {
            width: 240px; background: white; border-right: 1px solid #f0f0f0;
            padding: 24px 0; position: fixed; top: 64px; bottom: 0; left: 0; overflow-y: auto;
        }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-section-title {
            font-size: 11px; font-weight: 600; color: #9ca3af;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 0 20px; margin-bottom: 8px;
        }
        .sidebar-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 20px; cursor: pointer; transition: all 0.15s;
            font-size: 14px; color: #666; border-left: 3px solid transparent;
            text-decoration: none;
        }
        .sidebar-item:hover { background: #fafafa; color: #1a1a1a; }
        .sidebar-item.active {
            background: #f0f2ff; color: #667eea; border-left-color: #667eea; font-weight: 500;
        }
        .sidebar-item i { font-size: 18px; width: 20px; text-align: center; }
        .content { flex: 1; margin-left: 240px; padding: 32px; }
        .page-header { margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: #1a1a1a; }
        .page-subtitle { font-size: 14px; color: #666; margin-top: 4px; }
        .card {
            background: white; border-radius: 16px; padding: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }
        .balence-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        .balence-label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .balence-value { font-size: 36px; font-weight: 700; }
        .balence-value span { font-size: 20px; font-weight: 500; }
        .tabs {
            display: flex; gap: 8px; margin-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tab:hover { color: #1a1a1a; }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .transaction-item {
            display: flex; align-items: center; gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .transaction-icon.recharge { background: #f0fdf4; color: #16a34a; }
        .transaction-icon.chat { background: #f0f2ff; color: #667eea; }
        .transaction-icon.transfer-out { background: #fef2f2; color: #dc2626; }
        .transaction-icon.transfer-in { background: #f0fdf4; color: #16a34a; }
        .transaction-icon.redpacket-send { background: #fffbeb; color: #f59e0b; }
        .transaction-icon.redpacket-recv { background: #f0fdf4; color: #16a34a; }
        .transaction-icon.admin { background: #f3f4f6; color: #6b7280; }
        .transaction-info { flex: 1; min-width: 0; }
        .transaction-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .transaction-desc { font-size: 12px; color: #9ca3af; }
        .transaction-amount {
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .transaction-amount.positive { color: #16a34a; }
        .transaction-amount.negative { color: #dc2626; }
        .transaction-time {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
            text-align: right;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state p { font-size: 14px; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }
        .page-btn {
            padding: 8px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .page-btn:hover { background: #f9fafb; }
        .page-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
{% include "_navbar_css.html" %}
</head>
<body>
    <!-- 导航栏 -->
    {% include "_navbar.html" %}

    <div class="main-container">
        {% with active_page = 'transactions' %}
        {% include "_sidebar.html" %}
        {% endwith %}

        <!-- 主内容区 -->
        <main class="content">
            <div class="page-header">
                <h1 class="page-title">交易记录</h1>
                <p class="page-subtitle">查看你的余额变动明细</p>
            </div>

            <div class="balence-card">
                <div class="balence-label">当前余额</div>
                <div class="balence-value"><span>¥</span><span id="currentBalance">0.00</span></div>
            </div>

            <div class="card">
                <div class="tabs">
                    <div class="tab active" data-action="filterTransactions" data-args="'all'">全部</div>
                    <div class="tab" data-action="filterTransactions" data-args="'recharge'">充值</div>
                    <div class="tab" data-action="filterTransactions" data-args="'chat'">聊天消费</div>
                    <div class="tab" data-action="filterTransactions" data-args="'transfer'">转账</div>
                    <div class="tab" data-action="filterTransactions" data-args="'redpacket'">红包</div>
                </div>
                <div id="transactionList">
                    <div class="empty-state">
                        <i class="bi bi-receipt"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script nonce="{{ csp_nonce }}">
        let allTransactions = [];
        let currentFilter = 'all';

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadTransactions();
        });

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const data = await window.getUserInfo();
                if (data) {
                    const balence = parseFloat(data.balence || 0);
                    document.getElementById('balenceAmount').textContent = '¥' + balence.toFixed(2);
                    document.getElementById('currentBalance').textContent = balence.toFixed(2);
                    document.getElementById('userAvatar').textContent = data.user_name.charAt(0).toUpperCase();
                }
            } catch (e) {
                console.error('加载用户信息失败:', e);
            }
        }

        // 加载交易记录
        async function loadTransactions() {
            try {
                const res = await fetch('/api/transactions');
                const data = await res.json();
                if (data.transactions) {
                    allTransactions = data.transactions;
                    renderTransactions();
                }
            } catch (e) {
                console.error('加载交易记录失败:', e);
                document.getElementById('transactionList').innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-exclamation-circle"></i>
                        <p>加载失败，请刷新重试</p>
                    </div>
                `;
            }
        }

        // 过滤交易记录
        function filterTransactions(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderTransactions();
        }

        // 渲染交易记录
        function renderTransactions() {
            const container = document.getElementById('transactionList');
            let filtered = allTransactions;

            if (currentFilter !== 'all') {
                if (currentFilter === 'transfer') {
                    filtered = allTransactions.filter(t => t.type === 'transfer_out' || t.type === 'transfer_in');
                } else if (currentFilter === 'redpacket') {
                    filtered = allTransactions.filter(t => t.type === 'redpacket_send' || t.type === 'redpacket_recv');
                } else {
                    filtered = allTransactions.filter(t => t.type === currentFilter);
                }
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-receipt"></i>
                        <p>暂无交易记录</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(tx => {
                const typeInfo = getTypeInfo(tx.type);
                const isPositive = tx.amount > 0;
                const amount = Math.abs(tx.amount);
                
                return `
                    <div class="transaction-item">
                        <div class="transaction-icon ${typeInfo.iconClass}">
                            <i class="bi ${typeInfo.icon}"></i>
                        </div>
                        <div class="transaction-info">
                            <div class="transaction-title">${typeInfo.title}</div>
                            <div class="transaction-desc">${tx.remark || typeInfo.desc}</div>
                        </div>
                        <div>
                            <div class="transaction-amount ${isPositive ? 'positive' : 'negative'}">
                                ${isPositive ? '+' : '-'}¥${amount.toFixed(2)}
                            </div>
                            <div class="transaction-time">${formatTime(tx.created_at)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 获取类型信息
        function getTypeInfo(type) {
            const types = {
                recharge: {
                    icon: 'bi-wallet2',
                    iconClass: 'recharge',
                    title: '账户充值',
                    desc: '余额充值'
                },
                chat: {
                    icon: 'bi-chat-dots',
                    iconClass: 'chat',
                    title: '聊天消费',
                    desc: 'API 调用扣费'
                },
                transfer_out: {
                    icon: 'bi-send',
                    iconClass: 'transfer-out',
                    title: '转账转出',
                    desc: '向好友转账'
                },
                transfer_in: {
                    icon: 'bi-download',
                    iconClass: 'transfer-in',
                    title: '转账转入',
                    desc: '好友转账'
                },
                redpacket_send: {
                    icon: 'bi-gift',
                    iconClass: 'redpacket-send',
                    title: '发出红包',
                    desc: '给好友发红包'
                },
                redpacket_recv: {
                    icon: 'bi-gift-fill',
                    iconClass: 'redpacket-recv',
                    title: '领取红包',
                    desc: '好友红包'
                },
                admin_adjust: {
                    icon: 'bi-gear',
                    iconClass: 'admin',
                    title: '管理员调整',
                    desc: '管理员操作'
                }
            };
            return types[type] || {
                icon: 'bi-question-circle',
                iconClass: 'admin',
                title: type,
                desc: ''
            };
        }

        // 格式化时间
        function formatTime(timeStr) {
            if (!timeStr) return '';
            const date = new Date(timeStr);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.toLocaleDateString() + ' ' + date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
        }
    </script>
</body>
</html>
