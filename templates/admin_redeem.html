<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兑换码管理 - APIProxy</title>
    {% include "_navbar_css.html" %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style nonce="{{ csp_nonce }}">
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f7f8fa;
            min-height: 100vh;
            color: #2a2a35;
        }

        .content { margin-left: 240px; padding: 24px; }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ececf0;
        }

        .card h2 { font-size: 16px; margin-bottom: 6px; }
        .card .desc { font-size: 13px; color: #777; margin-bottom: 14px; }

        .btn {
            border: none; border-radius: 8px; padding: 8px 16px;
            font-size: 13px; cursor: pointer; background: #5b6cff; color: #fff;
        }
        .btn.secondary { background: #eef0f4; color: #444; }
        .btn.danger { background: #fde8e8; color: #c0392b; }
        .btn:hover { opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #f0f0f4; }
        th { color: #889; font-weight: 600; }

        input, select {
            padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 13px; width: 100%;
        }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
        .row label { font-size: 13px; color: #667; min-width: 70px; }

        .codes-out {
            margin-top: 12px; background: #f7f8fc; border: 1px dashed #d9dce6;
            border-radius: 10px; padding: 12px; font-family: monospace;
            font-size: 12px; white-space: pre-wrap; word-break: break-all;
            max-height: 220px; overflow: auto; display: none;
        }

        .badge-used { background: #e6f4ea; color: #1a7f37; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
        .badge-unused { background: #eef0f4; color: #555; padding: 2px 8px; border-radius: 6px; font-size: 12px; }

        .section-gap { margin-top: 20px; padding-top: 16px; border-top: 1px dashed #ececf0; }

        .sidebar { position: fixed; left: 0; top: 0; width: 240px; height: 100vh; background: #fff; border-right: 1px solid #ececf0; padding: 76px 12px 20px; overflow-y: auto; }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #99a; padding: 0 10px 6px; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; color: #556; font-size: 14px; border-left: 3px solid transparent; text-decoration: none; }
        .sidebar-item:hover { background: #f4f5f8; }
        .sidebar-item.active { background: #eef0ff; color: #4353ff; border-left: 3px solid #4353ff; }
        .sidebar-item i { font-size: 16px; }
    </style>
</head>
<body>
    {% include "_navbar.html" %}
    {% include "_sidebar.html" %}
    <div class="content">
        <div class="page-header" style="margin-bottom: 18px;">
            <h1 style="font-size: 20px;">兑换码管理</h1>
            <p style="font-size: 13px; color: #777;">批量生成充值兑换码，用户在「充值」页自助兑换</p>
        </div>

        <div class="card">
            <h2>批量生成</h2>
            <p class="desc">面额为每个码的入账金额（元）；单次最多 500 个</p>
            <div class="row">
                <label>数量</label>
                <input type="number" id="rcCount" value="10" min="1" max="500" style="width: 100px;">
                <label>面额（元）</label>
                <input type="number" id="rcAmount" value="10" min="0.01" step="0.01" style="width: 120px;">
                <label>备注</label>
                <input type="text" id="rcNote" placeholder="可选" style="width: 220px;">
                <button class="btn" id="rcGenBtn">生成</button>
            </div>
            <div class="codes-out" id="rcOut"></div>
        </div>

        <div class="card">
            <div class="row" style="margin-bottom: 10px;">
                <h2 style="margin: 0;">兑换码列表</h2>
                <select id="rcStatus" style="width: 120px;">
                    <option value="all">全部</option>
                    <option value="unused">未使用</option>
                    <option value="used">已使用</option>
                </select>
                <button class="btn secondary" id="rcListBtn">刷新</button>
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>码</th><th>面额</th><th>状态</th><th>创建人</th><th>兑换人</th><th>备注</th><th></th></tr>
                </thead>
                <tbody id="rcTbody"><tr><td colspan="8" style="text-align:center;color:#999;">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}">
    (function () {
        'use strict';
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g,
                c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function gen() {
            const btn = document.getElementById('rcGenBtn');
            const out = document.getElementById('rcOut');
            btn.disabled = true;
            try {
                const body = {
                    count: parseInt(document.getElementById('rcCount').value) || 1,
                    amount: parseFloat(document.getElementById('rcAmount').value) || 0,
                    note: document.getElementById('rcNote').value.trim()
                };
                const r = await fetch('/api/admin/redeem-codes/generate', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const j = await r.json();
                if (!r.ok) { out.style.display = 'block'; out.textContent = '生成失败：' + (j.error || r.status); return; }
                out.style.display = 'block';
                out.textContent = '已生成 ' + j.count + ' 个面额 ' + j.amount + ' 元的兑换码：\n' + (j.codes || []).join('\n');
                loadList();
            } finally { btn.disabled = false; }
        }

        async function loadList() {
            const tb = document.getElementById('rcTbody');
            const status = document.getElementById('rcStatus').value;
            try {
                const r = await fetch('/api/admin/redeem-codes?status=' + status);
                const j = await r.json();
                if (!r.ok) { tb.innerHTML = '<tr><td colspan="8" style="color:#c0392b;">' + esc(j.error || '加载失败') + '</td></tr>'; return; }
                const codes = j.codes || [];
                if (!codes.length) { tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;">暂无兑换码</td></tr>'; return; }
                tb.innerHTML = codes.map(c => `
                    <tr>
                        <td>${c.id}</td>
                        <td style="font-family:monospace;">${esc(c.code)}</td>
                        <td>${Number(c.amount).toFixed(2)} 元</td>
                        <td>${c.redeemed_by ? '<span class="badge-used">已使用</span>' : '<span class="badge-unused">未使用</span>'}</td>
                        <td>${esc(c.created_by || '')}</td>
                        <td>${esc(c.redeemed_by || '')}</td>
                        <td>${esc(c.note || '')}</td>
                        <td>${c.redeemed_by ? '' : `<button class="btn danger rc-del" data-id="${c.id}">删除</button>`}</td>
                    </tr>`).join('');
            } catch (e) {
                tb.innerHTML = '<tr><td colspan="8" style="color:#c0392b;">网络错误</td></tr>';
            }
        }

        document.getElementById('rcGenBtn').addEventListener('click', gen);
        document.getElementById('rcListBtn').addEventListener('click', loadList);
        document.getElementById('rcStatus').addEventListener('change', loadList);
        document.getElementById('rcTbody').addEventListener('click', async (ev) => {
            if (!ev.target.classList.contains('rc-del')) return;
            const id = ev.target.dataset.id;
            if (!confirm('删除该未使用兑换码？')) return;
            const r = await fetch('/api/admin/redeem-codes/' + id, { method: 'DELETE' });
            const j = await r.json();
            if (!r.ok) alert(j.error || '删除失败');
            loadList();
        });
        loadList();
    })();
    </script>
</body>
</html>
