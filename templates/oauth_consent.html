<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授权确认</title>
<style nonce="{{ csp_nonce }}">
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background:#f6f8fa; color:#1f2328; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding-top:8vh; }
  .wrap { width:380px; }
  .avatar { width:48px; height:48px; border:1px solid rgba(27,31,36,.15); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; background:#fff; color:#1f2328; }
  .card { background:#fff; border:1px solid #d0d7de; border-radius:6px; padding:24px; }
  h1 { font-size:18px; font-weight:600; text-align:center; margin-bottom:6px; }
  .sub { color:#656d76; font-size:14px; text-align:center; margin-bottom:18px; line-height:1.5; }
  .scopes { border-top:1px solid #d0d7de; margin-bottom:18px; }
  .scope { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid #d0d7de; font-size:14px; }
  .scope .ico { color:#1a7f37; flex:0 0 auto; margin-top:1px; font-weight:700; }
  .scope .desc b { font-weight:600; }
  .btn { width:100%; padding:11px; border:1px solid rgba(27,31,36,.15); border-radius:6px; background:#1f883d; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { background:#1a7f37; }
  .cancel { display:block; width:100%; margin-top:14px; background:none; border:none; color:#0969da; font-size:14px; cursor:pointer; }
  .cancel:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="avatar"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3zm-3 5a2 2 0 0 1 1 3.73V20a1 1 0 0 1-2 0v-2.27A2 2 0 0 1 12 14z"></path></svg></div>
    <div class="card">
      <h1>授权 {{ client.client_name }}</h1>
      <div class="sub">应用 <b>{{ client.client_name }}</b> 请求访问你的账号（当前登录：<b>{{ user_name }}</b>）。</div>
      <div class="scopes">
        {% for s in scope.split(' ') %}
        <div class="scope">
          <span class="ico">✓</span>
          <span class="desc"><b>{{ s }}</b> — {{ {'api':'调用 Cloud LLM API 代理','profile':'读取基本资料','openid':'返回用户标识'}.get(s, s) }}</span>
        </div>
        {% endfor %}
      </div>
      <form method="POST" action="/oauth/authorize">
        <input type="hidden" name="client_id" value="{{ client_id }}">
        <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
        <input type="hidden" name="response_type" value="{{ response_type }}">
        <input type="hidden" name="scope" value="{{ scope }}">
        <input type="hidden" name="state" value="{{ state }}">
        <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
        <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
        <button class="btn" type="submit" name="decision" value="allow">授权</button>
        <button class="cancel" type="submit" name="decision" value="deny">取消</button>
      </form>
    </div>
  </div>
</body>
</html>
