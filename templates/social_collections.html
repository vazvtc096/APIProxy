<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 社区</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style nonce="{{ csp_nonce }}">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
        }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: white; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 100;
        }
        .navbar-left { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
        }
        .logo svg { width: 20px; height: 20px; color: white; }
        .logo-text { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .navbar-right { display: flex; align-items: center; gap: 16px; }
        .balence-display {
            display: flex; align-items: center; gap: 8px;
            background: #f0f2ff; padding: 8px 16px; border-radius: 20px;
        }
        .balence-icon { color: #667eea; font-size: 16px; }
        .balence-amount { font-size: 14px; font-weight: 600; color: #667eea; }
        .user-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 16px; cursor: pointer;
        }
        .main-container { display: flex; padding-top: 64px; min-height: 100vh; }
        .sidebar {
            width: 240px; background: white; border-right: 1px solid #f0f0f0;
            padding: 24px 0; position: fixed; top: 64px; bottom: 0; left: 0; overflow-y: auto;
        }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-section-title {
            font-size: 11px; font-weight: 600; color: #9ca3af;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 0 20px; margin-bottom: 8px;
        }
        .sidebar-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 20px; cursor: pointer; transition: all 0.15s;
            font-size: 14px; color: #666; border-left: 3px solid transparent;
            text-decoration: none;
        }
        .sidebar-item:hover { background: #fafafa; color: #1a1a1a; }
        .sidebar-item.active {
            background: #f0f2ff; color: #667eea; border-left-color: #667eea; font-weight: 500;
        }
        .sidebar-item i { font-size: 18px; width: 20px; text-align: center; }
        .content { flex: 1; margin-left: 240px; padding: 32px; }
        .page-header { margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: #1a1a1a; }
        .page-subtitle { font-size: 14px; color: #666; margin-top: 4px; }
        .post-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            transition: all 0.2s;
            cursor: pointer;
        }
        .post-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .post-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 15px;
        }
        .post-meta { flex: 1; }
        .post-author { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .post-time { font-size: 12px; color: #9ca3af; }
        .post-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #666;
            transition: all 0.15s;
            background: transparent;
            border: none;
        }
        .icon-btn:hover { background: #f3f4f6; }
        .icon-btn.active { color: #ef4444; }
        .post-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        .post-content {
            font-size: 14px;
            line-height: 1.6;
            color: #374151;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .post-footer {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }
        .post-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
        }
        .post-stat i { font-size: 16px; }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #9ca3af;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        .empty-state i { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
        .empty-state p { font-size: 14px; margin-bottom: 8px; }
        .empty-state .sub { font-size: 13px; color: #9ca3af; }
        .toast {
            position: fixed; top: 80px; right: 24px;
            padding: 12px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 500;
            z-index: 2000;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .toast.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    </style>
{% include "_navbar_css.html" %}
</head>
<body>
    <!-- 导航栏 -->
    {% include "_navbar.html" %}

    <div class="main-container">
        {% with active_page = 'collections' %}
        {% include "_sidebar.html" %}
        {% endwith %}

        <!-- 主内容区 -->
        <main class="content">
            <div class="page-header">
                <h1 class="page-title">我的收藏</h1>
                <p class="page-subtitle">你收藏的所有帖子</p>
            </div>

            <div id="postList">
                <div class="empty-state">
                    <i class="bi bi-bookmark"></i>
                    <p>加载中...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script nonce="{{ csp_nonce }}">
        let posts = [];

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadFavorites();
        });

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const data = await window.getUserInfo();
                if (data) {
                    document.getElementById('balenceAmount').textContent = '¥' + parseFloat(data.balence || 0).toFixed(2);
                    document.getElementById('userAvatar').textContent = data.user_name.charAt(0).toUpperCase();
                }
            } catch (e) {
                console.error('加载用户信息失败:', e);
            }
        }

        // 加载收藏列表
        async function loadFavorites() {
            try {
                const res = await fetch('/api/posts/favorites');
                const data = await res.json();
                if (data.posts) {
                    posts = data.posts;
                    renderPosts();
                }
            } catch (e) {
                console.error('加载收藏失败:', e);
                document.getElementById('postList').innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-exclamation-circle"></i>
                        <p>加载失败，请刷新重试</p>
                    </div>
                `;
            }
        }

        // 渲染帖子列表
        function renderPosts() {
            const container = document.getElementById('postList');
            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-bookmark"></i>
                        <p>还没有收藏的帖子</p>
                        <p class="sub">去帖子广场看看有什么有趣的内容吧</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post-card" data-action="viewPost" data-args="'${post.post_id}'">
                    <div class="post-header">
                        <div class="post-avatar">${post.user_name.charAt(0).toUpperCase()}</div>
                        <div class="post-meta">
                            <div class="post-author">${post.user_name}</div>
                            <div class="post-time">${formatTime(post.created_at)}</div>
                        </div>
                        <div class="post-actions" data-stop>
                            <button class="icon-btn active" data-action="toggleFavorite" data-args="'${post.post_id}'" title="取消收藏">
                                <i class="bi bi-bookmark-fill"></i>
                            </button>
                        </div>
                    </div>
                    <h3 class="post-title">${escapeHtml(post.title)}</h3>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    <div class="post-footer">
                        <div class="post-stat">
                            <i class="bi bi-heart"></i>
                            <span>${post.likes || 0}</span>
                        </div>
                        <div class="post-stat">
                            <i class="bi bi-bookmark"></i>
                            <span>已收藏</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 查看帖子详情
        function viewPost(postId) {
            // 可以跳转到帖子详情页，或者在当前页面显示
            showToast('帖子详情功能开发中', 'success');
        }

        // 取消收藏
        async function toggleFavorite(postId) {
            try {
                const res = await fetch('/api/posts/' + postId + '/favorite', {
                    method: 'POST'
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('已取消收藏', 'success');
                    // 重新加载收藏列表
                    loadFavorites();
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) {
                showToast('操作失败，请重试', 'error');
            }
        }

        // 格式化时间
        function formatTime(timeStr) {
            if (!timeStr) return '';
            const date = new Date(timeStr);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.toLocaleDateString();
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 显示 Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
